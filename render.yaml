services:
  - type: web
    name: plaintext-wallet
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOPLUS_ACCESS_TOKEN
        sync: false
      - key: GOPLUS_DEBUG_LOG
        sync: false
      - key: X402_PAY_TO
        sync: false
      - key: X402_NETWORK
        sync: false
      - key: X402_CHECK_PRICE
        sync: false
      - key: X402_EXPLAIN_PRICE
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
